name: Build and publish

# Пуш в main -> собираем образ и пушим в Docker Hub. На сервер этот workflow НЕ ходит:
# новый образ забирает Watchtower, который там крутится (установка — deploy/watchtower-compose.yml
# в репозитории Auth). Поэтому здесь нет SSH-ключа — нужен только токен Docker Hub,
# а он доступа к серверу не даёт.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
  # На ветках гоняем только тесты: собирать и публиковать образ с ветки
  # незачем, а узнать, что что-то сломалось, лучше до слияния.
  pull_request:
    branches: [main]

# Не даём двум сборкам накладываться друг на друга, если запушили несколько коммитов подряд
concurrency:
  group: publish-zapas
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Тесты — обычные скрипты с кодом возврата, как в остальных сервисах.
      # Зависимостей нет, ставить нечего.
      - run: node test/expiry.test.mjs
      - run: node test/gs1.test.mjs
      - run: node test/leaflet.test.mjs
      - run: node test/home.test.mjs
      - run: node test/catalog.test.mjs
      - run: node test/store.test.mjs

  build-and-push:
    needs: test
    # Публикуем только с main. Без этой строки каждый pull request заливал бы
    # в Docker Hub тег latest, и Watchtower выкатил бы ветку на сервер.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: env
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: shadowkick/zapas:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
