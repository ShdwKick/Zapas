<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Иконка под маску Android: фон во всё поле (система сама скруглит как
       захочет), знак — внутри безопасного круга 80%. Без этого варианта
       Android подставляет белую подложку и обрезает квадрат по углам. -->
  <defs>
    <linearGradient id="f" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="112%" r="125%">
      <stop offset="0" stop-color="#171d2b"/>
      <stop offset=".62" stop-color="#0b0d12"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(112 112) scale(12)">
    <path fill="url(#f)" fill-rule="evenodd"
          d="M12 1.2C13.6 5 16.4 6.6 18.2 9.4C21.4 14.4 18.6 22.4 12 22.4C5.4 22.4 2.6 14.4 5.8 9.4C7.2 7.2 9.2 6 10.2 3.4C10.9 5.6 11.4 6.6 12 7.4C12.4 5.6 12.3 3.4 12 1.2ZM12 9.8 7.4 13.6V19.2H16.6V13.6Z"/>
  </g>
</svg>
